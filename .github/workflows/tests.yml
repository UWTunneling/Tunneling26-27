name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the older run (saves Actions minutes).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id "tests" is the status check name that branch protection requires.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            operator/requirements.txt

      # PySide6's Qt libraries link against these even when no window is opened.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # Catches syntax errors in GUI and CLI scripts the tests don't import.
      - name: Byte-compile all Python sources
        run: python -m compileall -q protocol.py send_messages.py start_sim_system.py mock-microcontroller operator tests

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -v
